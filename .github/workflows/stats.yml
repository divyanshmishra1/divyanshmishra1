name: Refresh profile stats

on:
  schedule:
    - cron: "17 0 * * *"   # daily, ~05:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render stats card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/stats.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
