name: Update stats cards

on:
  schedule:
    - cron: "17 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/cards.py, .github/workflows/cards.yml]

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/cards.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          git diff --cached --quiet || (git commit -m "chore: update stats cards" && git push)
