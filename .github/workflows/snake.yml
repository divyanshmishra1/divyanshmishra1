name: Contribution snake

on:
  schedule:
    - cron: "43 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F2B705&color_dots=#161b22,#3b2f0b,#6b5410,#a67c0b,#f2b705
            dist/snake-light.svg?color_snake=#b45309&color_dots=#ebedf0,#fde68a,#fbbf24,#d97706,#92400e
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
